<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>资源监控</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2a78d6">
<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb; --plane:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.04);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --track:#cde2fb; --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme=light])){
    color-scheme:dark;
    --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --track:#184f95;
  }
}
:root[data-theme=dark]{
  color-scheme:dark;
  --surface:#1a1a19; --plane:#0d0d0d; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --track:#184f95;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.page{max-width:1560px;margin:0 auto;padding:16px 18px 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;margin-bottom:12px}
header h1{font-size:20px;font-weight:600;margin:0}
header .meta{color:var(--ink2)}
header .status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.dot.off{background:var(--critical)}
button,select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 8px}
button{cursor:pointer}
button:hover{background:var(--wash)}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 14px;color:var(--ink2)}
.filters label{display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 10px;color:var(--ink2)}
.seg button.on{background:var(--wash);color:var(--ink);font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;min-height:138px}
.tile .label{display:flex;justify-content:space-between;gap:8px;color:var(--ink2);font-size:12px}
.tile .label .hint{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .value{font-size:24px;font-weight:600;line-height:1.15;margin-top:4px;display:flex;gap:16px;flex-wrap:wrap}
.tile .value.two>span{font-size:19px}
.tile .sub{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.35;white-space:pre-line}
.tile .foot{margin-top:auto;padding-top:6px}
.tile canvas{display:block;width:100%;height:26px}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--s1)}
.mrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-top:5px}
.mrow .k{min-width:44px;white-space:nowrap}
.mrow .meter{flex:1}
.mrow .st{margin:0;min-width:56px;text-align:right;white-space:nowrap}
.st{font-size:12px;color:var(--ink2)}
.st b{font-weight:600}
.st.good b{color:var(--good)}.st.warn b{color:var(--ink2)}.st.serious b{color:var(--serious)}.st.critical b{color:var(--critical)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:12px;margin-bottom:14px}
.chart h2{font-size:14px;font-weight:600;margin:0 0 2px;display:flex;align-items:baseline;gap:10px}
.chart h2 .u{color:var(--muted);font-weight:400;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin-bottom:4px;min-height:18px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:2px;border-radius:1px}
.plot{position:relative;height:210px}
.plot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:5;min-width:120px}
.tip .t{color:var(--muted);margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:8px;white-space:nowrap}
.tip .r i{display:inline-block;width:12px;height:2px;border-radius:1px}
.tip .r b{font-weight:600;font-variant-numeric:tabular-nums;min-width:64px}
.tip .r span{color:var(--ink2)}
details.tbl{margin-top:6px;font-size:12px}
details.tbl summary{cursor:pointer;color:var(--muted)}
details.tbl table{width:100%;border-collapse:collapse;margin-top:4px}
details.tbl th,details.tbl td{text-align:right;padding:2px 6px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
details.tbl th:first-child,details.tbl td:first-child{text-align:left}
.stale .plot, .stale .tiles{opacity:.55}
.procs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:900px){.procs{grid-template-columns:1fr}}
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:8px;height:24px;font-size:12px;cursor:default;border-radius:4px}
.bars .row:hover{background:var(--wash)}
.bars .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.bars .b{height:14px;position:relative}
.bars .b i{position:absolute;left:0;top:0;height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.bars .v{text-align:right;font-variant-numeric:tabular-nums}
.ptable{overflow:auto}
.ptable .bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px;color:var(--ink2)}
.ptable input{width:220px}
table.p{width:100%;border-collapse:collapse;font-size:13px}
table.p th{position:sticky;top:0;background:var(--surface);color:var(--muted);font-weight:500;text-align:right;padding:6px 8px;border-bottom:1px solid var(--axis);cursor:pointer;white-space:nowrap;user-select:none}
table.p th.on{color:var(--ink)}
table.p td{padding:4px 8px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.p th:first-child,table.p td:first-child,table.p th.l,table.p td.l{text-align:left}
table.p td.cmd{max-width:420px;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);text-align:left}
table.p tr:hover td{background:var(--wash)}
.more{margin-top:8px}
table.temps th{cursor:default}
table.temps td.m{padding-top:8px}
table.temps td.m .meter{margin:0}
table.temps canvas{width:120px;height:22px;display:block;margin-left:auto}
table.temps td.dev{color:var(--ink)}
table.temps tr.first td{border-top:1px solid var(--axis)}
footer{color:var(--muted);font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="page" id="page">
<header>
  <h1 id="host">…</h1>
  <span class="meta" id="sysmeta"></span>
  <span class="status"><span class="dot" id="dot"></span><span id="stat">连接中…</span><button id="theme" title="切换主题">主题：自动</button></span>
</header>

<div class="filters">
  <label>时间窗
    <span class="seg" id="range">
      <button data-v="120">2 分钟</button><button data-v="600" class="on">10 分钟</button><button data-v="1800">30 分钟</button><button data-v="3600">1 小时</button>
    </span>
  </label>
  <label>刷新
    <span class="seg" id="ivl">
      <button data-v="1000">1 秒</button><button data-v="2000" class="on">2 秒</button><button data-v="5000">5 秒</button>
    </span>
  </label>
  <label>网卡 <select id="iface"></select></label>
  <label>磁盘 <select id="disk"></select></label>
</div>

<div class="tiles" id="tiles"></div>

<div class="charts" id="charts"></div>

<div class="card ptable" style="margin-bottom:12px">
  <h2 style="font-size:14px;margin:0 0 8px">硬件温度 <span style="color:var(--muted);font-weight:400;font-size:12px">按传感器 · 进度条为相对临界值的比例</span></h2>
  <table class="p temps"><thead><tr><th class="l">硬件</th><th class="l">传感器</th><th>当前</th><th>阈值（告警 / 临界）</th><th style="width:220px">距临界</th><th>状态</th><th style="width:120px">走势</th></tr></thead><tbody id="tbody"></tbody></table>
</div>

<div class="procs">
  <div class="card"><h2 style="font-size:14px;margin:0 0 8px">CPU 占用最高的进程 <span class="u" style="color:var(--muted);font-weight:400;font-size:12px">按 PID · CPU%</span></h2><div class="bars" id="topcpu"></div></div>
  <div class="card"><h2 style="font-size:14px;margin:0 0 8px">内存占用最高的进程 <span class="u" style="color:var(--muted);font-weight:400;font-size:12px">按 PID · RSS</span></h2><div class="bars" id="topmem"></div></div>
</div>

<div class="card ptable">
  <div class="bar">
    <input id="q" placeholder="筛选进程名 / 命令 / 用户">
    <label><input type="checkbox" id="grp"> 按程序聚合</label>
    <span id="pcount"></span>
  </div>
  <table class="p"><thead id="phead"></thead><tbody id="pbody"></tbody></table>
  <button class="more" id="more">显示全部</button>
</div>

<footer>数据源：本机 Glances API（端口 61208），历史仅保存在浏览器内，最长 1 小时。</footer>
</div>
<div class="tip" id="gtip" hidden></div>

<script>
'use strict';
const API = `${location.protocol}//${location.hostname}:61208/api/4/all`;
const MAX_POINTS = 3700;
const hist = [];
let last = null, interval = 2000, range = 600, iface = null, disk = null, showAll = false;
let sortKey = 'cpu_percent', sortDir = -1;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtBytes = n => { if (n == null || isNaN(n)) return '–'; const u = ['B','KB','MB','GB','TB']; let i = 0; while (n >= 1024 && i < u.length-1) { n /= 1024; i++; } return (i === 0 ? n.toFixed(0) : n.toFixed(n >= 100 ? 0 : 1)) + ' ' + u[i]; };
const fmtRate = n => fmtBytes(n) + '/s';
const fmtPct = n => n == null ? '–' : n.toFixed(1) + '%';
const fmtTime = t => new Date(t).toTimeString().slice(0, 8);
const niceStep = (r, n) => { const raw = Math.max(r, 1e-9) / n, p = Math.pow(10, Math.floor(Math.log10(raw))); for (const m of [1, 2, 5, 10]) if (raw <= m * p) return m * p; return 10 * p; };
const status = p => p < 70 ? ['good','● 正常'] : p < 85 ? ['warn','▲ 偏高'] : p < 95 ? ['serious','▲ 紧张'] : ['critical','■ 告急'];
const UNITS = {
  pct:   { axis: v => v.toFixed(0) + '%', tip: fmtPct, min: 100 },
  bytes: { axis: v => fmtBytes(v), tip: fmtRate, min: 10240 },
  temp:  { axis: v => v.toFixed(0) + '°', tip: v => v.toFixed(0) + ' °C', min: 60 },
  load:  { axis: v => v.toFixed(1), tip: v => v.toFixed(2), min: 1 },
};

/* ---------- line chart ---------- */
class LineChart {
  constructor(parent, opts) {
    this.opts = opts;
    const card = document.createElement('div'); card.className = 'card chart';
    card.innerHTML = `<h2>${opts.title} <span class="u">${opts.unitLabel || ''}</span></h2><div class="legend"></div><div class="plot"><canvas></canvas></div><details class="tbl"><summary>数据表（最近 20 个采样）</summary><table></table></details>`;
    parent.appendChild(card);
    this.card = card; this.canvas = card.querySelector('canvas'); this.ctx = this.canvas.getContext('2d');
    this.legend = card.querySelector('.legend'); this.table = card.querySelector('table'); this.details = card.querySelector('details');
    this.hover = null; this.rows = [];
    this.canvas.addEventListener('pointermove', e => { this.hover = e.offsetX; this.draw(); });
    this.canvas.addEventListener('pointerleave', () => { this.hover = null; hideTip(); this.draw(); });
    new ResizeObserver(() => this.draw()).observe(card.querySelector('.plot'));
  }
  setSeries(series) { // [{label, color:'--s1', get: sample=>number}]
    this.series = series;
    this.legend.textContent = '';
    if (series.length > 1) for (const s of series) { const el = document.createElement('span'); const i = document.createElement('i'); i.style.background = css(s.color); el.append(i, s.label); this.legend.appendChild(el); }
  }
  update(rows) { this.rows = rows; this.draw(); if (this.details.open) this.renderTable(); }
  renderTable() {
    const u = UNITS[this.opts.unit]; const rows = this.rows.slice(-20).reverse();
    const t = this.table; t.textContent = '';
    const tr = document.createElement('tr'); tr.append(th('时间'), ...this.series.map(s => th(s.label))); t.appendChild(tr);
    for (const r of rows) { const tr2 = document.createElement('tr'); tr2.append(td(fmtTime(r.t)), ...this.series.map(s => td(u.tip(s.get(r) ?? 0)))); t.appendChild(tr2); }
    function th(x) { const e = document.createElement('th'); e.textContent = x; return e; }
    function td(x) { const e = document.createElement('td'); e.textContent = x; return e; }
  }
  draw() {
    const c = this.canvas, dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
    if (!W || !H) return;
    c.width = W * dpr; c.height = H * dpr;
    const g = this.ctx; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    g.font = '11px system-ui, sans-serif';
    const padL = 48, padR = 14, padT = 10, padB = 22, pw = W - padL - padR, ph = H - padT - padB;
    const now = Date.now(), t0 = now - range * 1000;
    const rows = this.rows, u = UNITS[this.opts.unit], stacked = !!this.opts.stacked;
    if (!rows.length || !this.series) { g.fillStyle = css('--muted'); g.textAlign = 'center'; g.fillText('等待数据…', W / 2, H / 2); return; }
    // values matrix
    const vals = this.series.map(s => rows.map(r => Math.max(0, s.get(r) ?? 0)));
    let peak = 0;
    for (let j = 0; j < rows.length; j++) { let acc = 0; for (let i = 0; i < vals.length; i++) { if (stacked) acc += vals[i][j]; else acc = Math.max(acc, vals[i][j]); } peak = Math.max(peak, acc); }
    let yMax = this.opts.yMax;
    if (!yMax) { const step = niceStep(Math.max(peak, u.min), 4); yMax = Math.ceil(Math.max(peak, u.min) / step) * step; }
    const yStep = this.opts.yMax ? this.opts.yMax / 4 : niceStep(yMax, 4);
    const X = t => padL + (t - t0) / (now - t0) * pw, Y = v => padT + ph - v / yMax * ph;
    // grid + y labels
    g.strokeStyle = css('--grid'); g.lineWidth = 1; g.fillStyle = css('--muted'); g.textAlign = 'right'; g.textBaseline = 'middle';
    for (let v = 0; v <= yMax + 1e-9; v += yStep) { const y = Math.round(Y(v)) + .5; g.beginPath(); g.moveTo(padL, y); g.lineTo(W - padR, y); g.stroke(); g.fillText(u.axis(v), padL - 6, y); }
    // x ticks
    const xs = [10, 30, 60, 120, 300, 600, 900, 1800].find(s => range / s <= 6) || 1800;
    g.textAlign = 'center'; g.textBaseline = 'top';
    for (let t = Math.ceil(t0 / (xs * 1000)) * xs * 1000; t <= now; t += xs * 1000) { const x = Math.round(X(t)) + .5; g.strokeStyle = css('--grid'); g.beginPath(); g.moveTo(x, padT); g.lineTo(x, padT + ph); g.stroke(); g.fillText(fmtTime(t).slice(0, xs >= 60 ? 5 : 8), x, padT + ph + 6); }
    // baseline
    g.strokeStyle = css('--axis'); g.beginPath(); g.moveTo(padL, Math.round(Y(0)) + .5); g.lineTo(W - padR, Math.round(Y(0)) + .5); g.stroke();
    // series
    g.save(); g.beginPath(); g.rect(padL, 0, pw, H); g.clip();
    const base = new Array(rows.length).fill(0);
    const tops = [];
    for (let i = 0; i < vals.length; i++) {
      const col = css(this.series[i].color); const top = vals[i].map((v, j) => (stacked ? base[j] : 0) + v); tops.push(top);
      // area wash
      g.beginPath(); rows.forEach((r, j) => g.lineTo(X(r.t), Y(top[j])));
      for (let j = rows.length - 1; j >= 0; j--) g.lineTo(X(rows[j].t), Y(stacked ? base[j] : 0));
      g.closePath(); g.globalAlpha = .10; g.fillStyle = col; g.fill(); g.globalAlpha = 1;
      // line
      g.beginPath(); g.lineWidth = 2; g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = col;
      rows.forEach((r, j) => g.lineTo(X(r.t), Y(top[j]))); g.stroke();
      // end marker with surface ring
      const lj = rows.length - 1; dot(g, X(rows[lj].t), Y(top[lj]), col);
      if (stacked) for (let j = 0; j < rows.length; j++) base[j] = top[j];
    }
    // crosshair
    if (this.hover != null && this.hover >= padL && this.hover <= W - padR) {
      const tx = t0 + (this.hover - padL) / pw * (now - t0);
      let j = 0, best = Infinity; rows.forEach((r, k) => { const d = Math.abs(r.t - tx); if (d < best) { best = d; j = k; } });
      const x = Math.round(X(rows[j].t)) + .5;
      g.strokeStyle = css('--axis'); g.lineWidth = 1; g.beginPath(); g.moveTo(x, padT); g.lineTo(x, padT + ph); g.stroke();
      this.series.forEach((s, i) => dot(g, x, Y(tops[i][j]), css(s.color)));
      const lines = this.series.map((s, i) => ({ c: css(s.color), v: u.tip(vals[i][j]), l: s.label }));
      if (stacked && vals.length > 1) lines.push({ c: css('--axis'), v: u.tip(tops[tops.length - 1][j]), l: '合计' });
      showTip(this.canvas, this.hover, fmtTime(rows[j].t), lines);
    }
    g.restore();
    function dot(g, x, y, col) { g.beginPath(); g.arc(x, y, 6, 0, Math.PI * 2); g.fillStyle = css('--surface'); g.fill(); g.beginPath(); g.arc(x, y, 4, 0, Math.PI * 2); g.fillStyle = col; g.fill(); }
  }
}

/* ---------- per-core column chart ---------- */
class ColumnChart {
  constructor(parent, title) {
    const card = document.createElement('div'); card.className = 'card chart';
    card.innerHTML = `<h2>${title} <span class="u">%</span></h2><div class="legend"></div><div class="plot"><canvas></canvas></div><details class="tbl"><summary>数据表</summary><table></table></details>`;
    parent.appendChild(card); this.canvas = card.querySelector('canvas'); this.ctx = this.canvas.getContext('2d'); this.table = card.querySelector('table'); this.details = card.querySelector('details');
    this.vals = []; this.hover = null;
    this.canvas.addEventListener('pointermove', e => { this.hover = e.offsetX; this.draw(); });
    this.canvas.addEventListener('pointerleave', () => { this.hover = null; hideTip(); this.draw(); });
    new ResizeObserver(() => this.draw()).observe(card.querySelector('.plot'));
  }
  update(vals) { this.vals = vals; this.draw(); if (this.details.open) { const t = this.table; t.textContent = ''; const tr = document.createElement('tr'); vals.forEach((v, i) => { const th = document.createElement('th'); th.textContent = 'CPU' + i; tr.appendChild(th); }); t.appendChild(tr); const tr2 = document.createElement('tr'); vals.forEach(v => { const td = document.createElement('td'); td.textContent = fmtPct(v); tr2.appendChild(td); }); t.appendChild(tr2); } }
  draw() {
    const c = this.canvas, dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight; if (!W || !H) return;
    c.width = W * dpr; c.height = H * dpr; const g = this.ctx; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); g.font = '11px system-ui, sans-serif';
    const padL = 48, padR = 14, padT = 10, padB = 22, pw = W - padL - padR, ph = H - padT - padB, n = this.vals.length;
    g.strokeStyle = css('--grid'); g.fillStyle = css('--muted'); g.textAlign = 'right'; g.textBaseline = 'middle';
    for (let v = 0; v <= 100; v += 25) { const y = Math.round(padT + ph - v / 100 * ph) + .5; g.beginPath(); g.moveTo(padL, y); g.lineTo(W - padR, y); g.stroke(); g.fillText(v + '%', padL - 6, y); }
    g.strokeStyle = css('--axis'); g.beginPath(); g.moveTo(padL, Math.round(padT + ph) + .5); g.lineTo(W - padR, Math.round(padT + ph) + .5); g.stroke();
    if (!n) return;
    const slot = pw / n, bw = Math.min(24, slot - 2), col = css('--s1');
    let hi = -1; if (this.hover != null) hi = Math.floor((this.hover - padL) / slot);
    g.textAlign = 'center'; g.textBaseline = 'top';

function toSample(d, sens) {
  const s = { t: Date.now(), cpu: d.cpu.total, user: d.cpu.user, sys: d.cpu.system, iowait: d.cpu.iowait, mem: d.mem.percent, swap: d.memswap.percent, load1: d.load.min1, load5: d.load.min5, load15: d.load.min15, net: {}, dsk: {}, temp: {} };
  for (const n of d.network) s.net[n.interface_name] = { rx: n.bytes_recv_rate_per_sec || 0, tx: n.bytes_sent_rate_per_sec || 0 };
  for (const n of d.diskio) s.dsk[n.disk_name] = { r: n.read_bytes_rate_per_sec || 0, w: n.write_bytes_rate_per_sec || 0 };
  if (sens) { for (const n of sens) { if (n.unit === 'W') s.gpuW = n.value; else s.temp[n.id] = n.value; } }

}

/* ---------- polling ---------- */
const dot = document.getElementById('dot'), statEl = document.getElementById('stat'), page = document.getElementById('page');
async function poll() {
  const t = Date.now();
  try {
    const [r, rs] = await Promise.all([fetch(API, { cache: 'no-store' }), fetch('sensors.json', { cache: 'no-store' }).catch(() => null)]);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json(); last = d;
    let sens = null; if (rs && rs.ok) { sens = (await rs.json()).sensors; const gn = d.gpu && d.gpu[0] && d.gpu[0].name; if (gn) for (const x of sens) if (x.device_id === 'gpu') x.device = 'GPU · ' + gn; sensorMeta = sens.filter(x => x.unit !== 'W'); }
    else if (sensorMeta.length === 0) sensorMeta = d.sensors.filter(x => x.type === 'temperature_core' && x.value != null).map(x => ({ id: x.label, device_id: x.label, device: 'Glances 传感器（未识别硬件）', group: 'core', label: x.label, warn: x.warning > 500 ? null : x.warning, crit: x.critical > 500 ? null : x.critical }));
    hist.push(toSample(d, sens)); while (hist.length > MAX_POINTS) hist.shift();
    const ifs = d.network.map(n => n.interface_name); if (!iface) iface = d.network.slice().sort((a, b) => b.bytes_all_gauge - a.bytes_all_gauge)[0]?.interface_name || 'all';
    fillSelect(document.getElementById('iface'), ifs, iface, '全部（合计）');
    const dks = d.diskio.map(n => n.disk_name); if (!disk) disk = dks[0];
    fillSelect(document.getElementById('disk'), dks, disk);
    dot.classList.remove('off'); page.classList.remove('stale'); statEl.textContent = '更新于 ' + fmtTime(Date.now());
    render();
  } catch (e) { dot.classList.add('off'); page.classList.add('stale'); statEl.textContent = '连接失败：' + e.message; }
  setTimeout(poll, Math.max(200, interval - (Date.now() - t)));
}

/* ---------- controls ---------- */
function seg(id, cb) { const el = document.getElementById(id); el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; for (const x of el.children) x.classList.toggle('on', x === b); cb(+b.dataset.v); }); }
seg('range', v => { range = v; render(); });
seg('ivl', v => { interval = v; });
document.getElementById('iface').addEventListener('change', e => { iface = e.target.value; render(); });
document.getElementById('disk').addEventListener('change', e => { disk = e.target.value; render(); });
document.getElementById('q').addEventListener('input', () => render());
document.getElementById('grp').addEventListener('change', () => render());
document.getElementById('more').addEventListener('click', () => { showAll = !showAll; render(); });
const themes = ['auto', 'dark', 'light'], themeBtn = document.getElementById('theme');
function applyTheme(t) { if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; themeBtn.textContent = '主题：' + { auto: '自动', dark: '深色', light: '浅色' }[t]; localStorage.setItem('theme', t); render(); }
themeBtn.addEventListener('click', () => applyTheme(themes[(themes.indexOf(localStorage.getItem('theme') || 'auto') + 1) % 3]));
applyTheme(localStorage.getItem('theme') || 'auto');
poll();
</script>
</body>
